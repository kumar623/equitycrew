# Render blueprint. Push this repo to GitHub, then:
# Render dashboard → New → Blueprint → pick the repo → set ANTHROPIC_API_KEY.
#
# The free instance has 512MB RAM and this app peaks near 438MB with 10-K
# retrieval active — it fits, but barely. If the service gets OOM-killed,
# set EQUITYCREW_DISABLE_RAG=1 in the dashboard: the Risk agent then reasons
# over live fundamentals instead of loading the embedding model.
services:
  - type: web
    name: equitycrew
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore        # closest Render region to India
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the dashboard; never commit it
