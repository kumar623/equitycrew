# Fly.io deploy — works straight from this folder (no GitHub repo required).
#   fly launch --no-deploy --copy-config
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
#   fly deploy
app = "equitycrew"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero when idle; a cold start costs a few seconds on the first hit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response]
    # SSE: the agent stream stays open for ~90s per research run.
    pristine = true

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # 1GB: torch + the MiniLM embedding model need more than a 512MB box.
  memory = "1gb"
